<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASTER TECH | Admin de categorías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/estilos.css">
    <link rel="stylesheet" href="../CSS/admin.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark admin-barra">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="../index.html"><i class="bi bi-house-fill me-2"></i>MASTER TECH</a>
        <div class="admin-enlaces">
            <a class="nav-link" href="admin-productos.html"><i class="bi bi-box-seam"></i> Productos</a>
            <a class="nav-link active" href="admin-categorias.html" aria-current="page"><i class="bi bi-tags"></i> Categorías</a>
            <a class="nav-link" href="admin-dashboard.html"><i class="bi bi-bar-chart-line"></i> Dashboard</a>
        </div>
    </div>
</nav>

<main class="admin-principal admin-principal-angosto">
    <div class="admin-encabezado">
        <div>
            <h1 class="admin-titulo">Gestión de categorías</h1>
            <p class="admin-subtitulo">Solo se pueden eliminar categorías que no tengan productos.</p>
        </div>
        <button type="button" id="btnNuevaCategoria" class="btn btn-mastertech px-4">
            <i class="bi bi-plus-lg me-1"></i>Nueva categoría
        </button>
    </div>

    <div id="avisos"></div>

    <div class="tabla-envoltorio">
        <table class="tabla-admin">
            <thead>
            <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Productos</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>
</main>

<!-- Modal: creación y edición -->
<div class="modal fade" id="modalCategoria" tabindex="-1" aria-labelledby="tituloModalCategoria" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content" id="formCategoria" novalidate>
            <div class="modal-header">
                <h5 class="modal-title" id="tituloModalCategoria">Nueva categoría</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="categoriaId">
                <div class="alert alert-danger d-none" id="errorFormCategoria" role="alert"></div>
                <div class="mb-3">
                    <label class="form-label" for="categoriaNombre">Nombre</label>
                    <input type="text" class="form-control" id="categoriaNombre" placeholder="Ej. Monitores" required>
                    <div class="invalid-feedback">Escribe el nombre de la categoría.</div>
                </div>
                <div>
                    <label class="form-label" for="categoriaDescripcion">Descripción</label>
                    <textarea class="form-control" id="categoriaDescripcion" rows="3" placeholder="Qué tipo de productos incluye"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-mastertech px-4">
                    <i class="bi bi-check-lg me-1"></i><span id="textoGuardarCategoria">Crear categoría</span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Modal: confirmar eliminación -->
<div class="modal fade" id="modalEliminar" tabindex="-1" aria-labelledby="tituloModalEliminar" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tituloModalEliminar">Eliminar categoría</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                Vas a eliminar <strong id="nombreCategoriaEliminar"></strong>. Esta acción no se puede deshacer.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-danger" id="btnConfirmarEliminar">Eliminar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../JS/productos.js"></script>
<script src="../JS/almacen.js"></script>
<script src="../JS/renderizado.js"></script>
<script src="../JS/admin-comun.js"></script>
<script src="../JS/admin-categorias.js"></script>
</body>
</html>
