<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASTER TECH | Admin de usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/estilos.css">
    <link rel="stylesheet" href="../CSS/admin.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark admin-barra">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="../index.html"><i class="bi bi-house-fill me-2"></i>MASTER TECH</a>
        <div class="admin-enlaces">
            <a class="nav-link" href="admin-productos.html"><i class="bi bi-box-seam"></i> Productos</a>
            <a class="nav-link" href="admin-categorias.html"><i class="bi bi-tags"></i> Categorías</a>
            <a class="nav-link active" href="admin-usuarios.html" aria-current="page"><i class="bi bi-people"></i> Usuarios</a>
            <a class="nav-link" href="admin-dashboard.html"><i class="bi bi-bar-chart-line"></i> Dashboard</a>
        </div>
    </div>
</nav>

<main class="admin-principal">
    <div class="admin-encabezado">
        <div>
            <h1 class="admin-titulo">Gestión de usuarios</h1>
            <p class="admin-subtitulo">Consulta y administra los usuarios de Master Tech.</p>
        </div>
    </div>

    <div id="avisos"></div>
    <div class="barra-herramientas">
        <input type="search" id="buscador" class="form-control" placeholder="Buscar por nombre, correo o rol" aria-label="Buscar usuarios">
        <button type="button" id="btnLimpiar" class="btn btn-outline-secondary">
            <i class="bi bi-x-lg me-1"></i>Limpiar
        </button>
    </div>
    <div class="tabla-envoltorio">
        <table class="tabla-admin">
            <thead>
            <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Rol</th>
                <th>Estado</th>
            </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../JS/productos.js"></script>
<script src="../JS/usuarios-datos.js"></script>
<script src="../JS/almacen.js"></script>
<script src="../JS/renderizado.js"></script>
<script src="../JS/admin-comun.js"></script>
<script src="../JS/admin-usuarios.js"></script>
</body>
</html>
